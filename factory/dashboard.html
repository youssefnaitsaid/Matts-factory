<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='black' d='M16 28 5 10h22z'/%3E%3C/svg%3E">
<title>Factory · Vercel deployments board v2</title>
<style>
  :root{
    --bg:#fafafa; --panel:#ffffff; --panel-2:#f4f4f5;
    --line:#eaeaea; --line-strong:#d4d4d4;
    --text:#171717; --muted:#5c5c5c; --faint:#737373;
    --acc:#0070f3; --acc-bg:#e8f2ff;
    --done:#17c964; --done-bg:#e9f9f0;
    --build:#f5a623; --build-bg:#fef6e7;
    --err:#e00; --err-bg:#fdecec;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font:13.5px/1.55 var(--sans);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
  ::selection{background:#000;color:#fff}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
  /* top nav — Vercel */
  .nav{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .nav-in{max-width:1500px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:0 24px;height:60px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:650;font-size:14px}
  .logo svg{width:20px;height:20px}
  .tabs{display:flex;gap:2px;margin-left:8px}
  .tabs span{font-size:13.5px;color:var(--muted);padding:7px 12px;border-radius:6px;white-space:nowrap}
  .tabs span.on{color:var(--text);background:var(--panel-2);font-weight:550}
  .nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .live{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;color:var(--muted);border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;white-space:nowrap}
  .live .dot{width:7px;height:7px;border-radius:50%;background:var(--done)}
  .live.error .dot{background:var(--err)}
  /* project header */
  .proj{max-width:1500px;margin:0 auto;padding:28px 24px 0}
  .proj h1{margin:0;font-size:26px;font-weight:650;letter-spacing:-.03em}
  .proj .sub{color:var(--muted);font-size:13.5px;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:550;border:1px solid var(--line);border-radius:20px;padding:3px 11px;background:#fff}
  .pill .d{width:7px;height:7px;border-radius:50%;background:var(--done)}
  .filterbar{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .fsearch{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--faint)}
  .fsearch svg{width:15px;height:15px;flex:none}
  .fsearch input{border:0;outline:none;font:inherit;width:100%;background:none;color:var(--text)}
  .fbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:550;cursor:default;white-space:nowrap}
  /* board */
  .board{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;padding:20px 24px 60px;align-items:start}
  .lane{min-width:0}
  .lane-head{display:flex;align-items:center;gap:8px;margin:0 2px 10px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
  .lane-head .c{margin-left:auto;font-family:var(--mono);font-size:11px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:1px 9px;color:var(--muted);text-transform:none;letter-spacing:0}
  .lane.gate .lane-head{color:var(--text)}
  .dep{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;margin-bottom:10px;transition:border-color .15s ease,box-shadow .15s ease,transform .15s ease}
  .dep:hover{border-color:#000;box-shadow:0 4px 18px rgba(0,0,0,.08)}
  .dep:active{transform:scale(.993)}
  .dep.gate{border-color:#000;border-width:1.2px}
  .dep-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .dep-ic{width:16px;height:16px;flex:none;display:grid;place-items:center}
  .dep-ic svg{width:16px;height:16px;display:block}
  .dep-ic.spin svg{animation:rot 1.1s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(245,166,35,.45)}50%{opacity:.55;box-shadow:0 0 0 5px rgba(245,166,35,0)}}
  .st-pill{margin-left:auto;font-size:11px;font-weight:600;border-radius:20px;padding:3px 10px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);white-space:nowrap}
  .st-pill.done{color:#0e7a3d;background:var(--done-bg);border-color:#b7e8cb}
  .st-pill.building{color:#93590a;background:var(--build-bg);border-color:#f3d9a4;animation:pulse 1.5s ease-in-out infinite}
  .st-pill.attention{color:#fff;background:#000;border-color:#000}
  .dep h2{margin:0 0 3px;font-size:13.5px;font-weight:600;letter-spacing:-.01em;line-height:1.45}
  .dep .br{font-family:var(--mono);font-size:11px;color:var(--faint);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dep .br svg{width:12px;height:12px;flex:none}
  .bar{height:4px;border-radius:2px;background:var(--panel-2);margin:11px 0 8px;overflow:hidden}
  .bar i{display:block;height:100%;background:#000;border-radius:2px;transition:width .4s cubic-bezier(.2,.7,.3,1)}
  .bar i.full{background:var(--done)}
  .tickets{display:grid;gap:4px;margin-top:6px}
  .tk{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:#fff;white-space:nowrap;overflow:hidden}
  .tk-ic{width:13px;height:13px;flex:none;display:grid;place-items:center}
  .tk-ic svg{width:13px;height:13px;display:block}
  .tk-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tk-st{margin-left:auto;color:var(--faint);flex:none}
  .tk.done{color:#0e7a3d}.tk.done .tk-st{color:#0e7a3d}
  .tk.doing{color:var(--text);border-color:#000}.tk.doing .tk-st{color:var(--text)}
  .tk.doing .tk-ic svg{animation:rot 1.1s linear infinite}
  .rowlabel{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:8px}
  .cmdbox{margin-top:10px;background:#000;color:#fff;border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:11px;line-height:1.8;user-select:all;cursor:text}
  .cmdbox .dim{color:#a1a1aa}
  .empty{background:#fff;border:1px dashed var(--line-strong);border-radius:10px;padding:22px 14px;text-align:center;color:var(--faint);font-size:12.5px}
  /* drawer */
  .scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.32);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .18s ease}
  .drawer{position:fixed;top:0;right:0;bottom:0;z-index:50;width:min(940px,100vw);background:#fff;border-left:1px solid var(--line);display:grid;grid-template-rows:auto 1fr;transform:translateX(102%);transition:transform .22s cubic-bezier(.32,.72,0,1);box-shadow:-20px 0 60px rgba(0,0,0,.18)}
  .open .scrim{opacity:1;pointer-events:auto}
  .open .drawer{transform:none}
  .d-head{padding:22px 26px 16px;border-bottom:1px solid var(--line);position:relative}
  .d-head .num{font-family:var(--mono);font-size:11px;color:var(--faint);margin-bottom:5px}
  .d-head h2{margin:0 44px 5px 0;font-size:19px;letter-spacing:-.02em;line-height:1.4}
  .close{position:absolute;top:18px;right:18px;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:17px;color:var(--muted)}
  .close:hover{background:#000;color:#fff;border-color:#000}
  .d-body{display:grid;grid-template-columns:240px 1fr;min-height:0}
  .files{border-right:1px solid var(--line);padding:10px;overflow-y:auto;background:var(--bg)}
  .files .group{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-family:var(--mono);margin:12px 8px 4px}
  .file{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 9px;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--muted);min-height:32px}
  .file:hover{background:#e8e8e8;color:var(--text)}
  .file.on{background:#000;color:#fff}
  .file .v{width:7px;height:7px;border-radius:50%;background:#d4d4d4;flex:none}
  .v.good{background:var(--done)}.v.warn{background:var(--build)}.v.stop{background:var(--err)}
  .doc{overflow-y:auto;padding:24px 30px 70px}
  .md{max-width:66ch;line-height:1.7;font-size:14px}
  .md pre{background:#000;color:#fafafa;border-radius:10px;padding:16px 18px;overflow-x:auto}
  .md code{font-family:var(--mono);font-size:12.5px}
  .md :not(pre)>code{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
  .verdict{display:inline-block;font-size:12px;font-weight:650;letter-spacing:.02em;padding:6px 14px;border-radius:20px;margin-bottom:16px;border:1px solid}
  .verdict.good{color:#0e7a3d;background:var(--done-bg);border-color:#b7e8cb}
  .verdict.warn{color:#93590a;background:var(--build-bg);border-color:#f3d9a4}
  .verdict.stop{color:#fff;background:#000;border-color:#000}
  footer{max-width:1500px;margin:0 auto;padding:14px 24px 40px;color:var(--faint);font-family:var(--mono);font-size:11px;display:flex;gap:8px 20px;flex-wrap:wrap;border-top:1px solid var(--line)}
  .skel{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff;margin-bottom:10px}
  .skel i{display:block;border-radius:4px;background:linear-gradient(90deg,#eee 25%,#f7f7f7 50%,#eee 75%);background-size:200% 100%;animation:sh 1.4s infinite}
  @keyframes sh{to{background-position:-200% 0}}
  @media (max-width:1100px){.board{grid-template-columns:repeat(3,minmax(0,1fr))}.tabs{display:none}}
  @media (max-width:640px){.board{grid-template-columns:1fr}.d-body{grid-template-columns:1fr}.files{border-right:0;border-bottom:1px solid var(--line)}}
  @media (prefers-reduced-motion:reduce){.st-pill.building,.tk.doing .tk-ic svg,.dep-ic.spin svg,.skel i{animation:none}}
</style>
</head>
<body>
<header class="nav"><div class="nav-in">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M17 18h1"/><path d="M12 18h1"/><path d="M7 18h1"/></svg>Matt's Factory</div>
  <nav class="tabs" aria-label="Sections"><span class="on">Pipelines</span></nav>
  <div class="nav-right"><div class="live" id="status" role="status">connecting…</div></div>
</div></header>
<div class="proj">
  <h1>agent-pipelines</h1>
  <div class="sub"><span class="pill"><span class="d"></span>production · tickets → implement → review → needs-human → pr → retro</span><span id="counts-line" style="font-family:var(--mono);font-size:11.5px"></span></div>
  <div class="filterbar">
    <label class="fsearch"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg><input id="q" type="search" placeholder="Search deployments… (job, feature, branch, ticket)" aria-label="Search jobs"></label>
    <span class="fbtn">Stage: All</span><span class="fbtn">Branch: factory/*</span>
  </div>
</div>
<div id="banner"></div>
<main class="board" id="board" aria-live="polite"></main>
<footer><span>/factory &lt;spec-path&gt;</span><span>/factory accept &lt;job-id&gt;</span><span>/factory rework &lt;job-id&gt; &lt;note&gt;</span><span>npx serve factory -l 8000 → dashboard-vercel-2.html</span></footer>
<div id="overlay"><div class="scrim" data-close></div>
<aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title">
  <div class="d-head"><div class="num" id="d-num"></div><h2 id="d-title"></h2><div id="d-branch" style="font-family:var(--mono);font-size:11px;color:var(--faint)"></div><button class="close" data-close aria-label="Close">×</button></div>
  <div class="d-body"><nav class="files" id="d-files"></nav><article class="doc"><div class="md" id="d-doc"></div></article></div>
</aside></div>
<script>
const POLL_MS=2000;
const STAGES=[{key:'tickets',label:'Queued'},{key:'implement',label:'Building'},{key:'review',label:'Reviewing'},{key:'needs-human',label:'Approval required',cls:'gate'},{key:'done',label:'Done'}];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let jobs=[],lastRender='',openJobId=null,openPath=null,openText=null,query='',firstLoad=true;
$('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();lastRender='';render();});
async function fetchText(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(u+': HTTP '+r.status);return r.text()}
function vStatus(j){if(j.stage==='done')return['done','Done'];if(j.stage==='pr')return['building','Writing PR'];if(j.stage==='retro')return['building','Retro'];if(j.stage==='needs-human')return['attention','Approval'];if(j.stage==='review')return['building','Reviewing'];if(j.stage==='implement'){return Object.values(j.tickets||{}).includes('doing')?['building','Building']:['building','Queued']}return['queued','Queued']}
// Check-run icons, same shapes as dashboard-github (fills tuned for the light theme)
const IC={
 ok:'<svg viewBox="0 0 16 16" fill="#1a7f37"><path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zm3.7 6.3-4.2 4.2a.7.7 0 0 1-1 0L4.3 8.3a.7.7 0 0 1 1-1l1.7 1.7 3.7-3.7a.7.7 0 0 1 1 1z"/></svg>',
 run:'<svg viewBox="0 0 16 16" fill="none" stroke="orange" stroke-width="2"><path d="M8 1.5a6.5 6.5 0 1 1-6.3 8" stroke-linecap="round"/><path d="M1.7 4v4h4" stroke-linecap="round"/></svg>',
 idle:'<svg viewBox="1.5 1.5 13 13" fill="grey"><circle cx="8" cy="8" r="5.5" fill="none" stroke="grey" stroke-width="1.6"/><circle cx="8" cy="8" r="1.6"/></svg>',
 warn:'<svg viewBox="0 0 16 16" fill="orange"><path d="M8 1 0 14h16zM7 6v4h2V6zm0 5v2h2v-2z" transform="translate(0 .5)"/></svg>'
};
function depIcon(sk){if(sk==='done')return IC.ok;if(sk==='attention')return IC.warn;if(sk==='building')return IC.run;return IC.idle}
function tkIcon(v){if(v==='done')return IC.ok;if(v==='doing')return IC.run;if(v==='BLOCKED'||v==='CHANGES')return IC.warn;return IC.idle}
function card(j){
  const entries=Object.entries(j.tickets||{});const done=entries.filter(([,v])=>v==='done').length;const total=entries.length;const pct=total?Math.round(done/total*100):0;
  const[sk,sl]=vStatus(j);const human=j.stage==='needs-human';
  const tks=entries.map(([k,v])=>'<span class="tk '+(v==='done'?'done':v==='doing'?'doing':'')+'"><span class="tk-ic">'+tkIcon(v)+'</span><span class="tk-name">'+esc(k.replace(/^\d+-/,''))+'</span><span class="tk-st">'+esc(v)+'</span></span>').join('');
  const rev=j.round>0?'<div class="rowlabel">review</div><span class="tk '+(j.review==='PASS'?'done':'')+'"><span class="tk-ic">'+(j.review==='PASS'?IC.ok:j.review==='CHANGES'?IC.warn:IC.idle)+'</span><span class="tk-name">round '+j.round+'</span><span class="tk-st">'+esc(j.review||'pending')+'</span></span>':'';
  const gate=j.decision&&j.decision!=='pending'?'<div class="rowlabel">gate</div><span class="tk'+'"><span class="tk-ic">'+(j.decision==='ESCALATE'?IC.warn:IC.idle)+'</span><span class="tk-name">gate</span><span class="tk-st">'+esc(j.decision)+'</span></span>':'';
  const[num,...slug]=j.id.split('-');
  return '<button class="dep '+(human?'gate':'')+'" data-job="'+esc(j.id)+'"><div class="dep-top"><span class="dep-ic '+(sk==='building'?'spin':'')+'">'+depIcon(sk)+'</span><span style="font-family:var(--mono);font-size:11px;color:var(--faint)">'+esc(num)+' · '+esc(slug.join('-'))+'</span><span class="st-pill '+sk+'">'+sl+'</span></div><h2>'+esc(j.feature)+'</h2><div class="br"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 3a2 2 0 1 0 0 .1M5 3v10M5 13a2 2 0 1 0 0 .1M11 3a2 2 0 1 0 0 .1M11 5c0 3-4 2.5-6 5"/></svg>'+esc(j.branch)+(j.round?' · R'+j.round:'')+'</div><div class="bar" aria-hidden="true"><i class="'+(pct===100?'full':'')+'" style="width:'+pct+'%"></i></div><div style="font-family:var(--mono);font-size:10.5px;color:var(--faint)">tickets '+done+'/'+total+' · '+pct+'%</div><div class="tickets">'+(tks||'<span class="tk"><span class="tk-ic">'+IC.idle+'</span><span class="tk-name">no tickets yet</span></span>')+rev+gate+'</div>'+(human?'<div class="cmdbox"><span class="dim"># needs your call — run one:</span><br>/factory accept '+esc(j.id)+'<br>/factory rework '+esc(j.id)+' &lt;note&gt;</div>':'')+'</button>';
}
function stageOf(j){return(j.stage==='pr'||j.stage==='retro')?'done':j.stage}
function vis(j){if(!query)return true;return(j.id+' '+j.feature+' '+j.branch+' '+Object.keys(j.tickets||{}).join(' ')).toLowerCase().includes(query)}
function skeletons(){return '<div class="skel"><i style="height:12px;width:45%"></i><i style="height:16px;width:90%;margin-top:10px"></i><i style="height:10px;width:60%;margin-top:10px"></i></div>'.repeat(2)}
async function render(){
  const problems=[];const by=Object.fromEntries(STAGES.map(s=>[s.key,[]]));
  jobs.filter(vis).forEach(j=>{const k=stageOf(j);if(!by[k])problems.push('Job '+j.id+' has unknown stage "'+j.stage+'"');else by[k].push(card(j))});
  const html=STAGES.map(s=>'<section class="lane '+(s.cls||'')+'"><div class="lane-head"><span>'+s.label+'</span><span class="c">'+by[s.key].length+'</span></div>'+(firstLoad&&!jobs.length?skeletons():(by[s.key].reverse().join('')||'<div class="empty">No deployments</div>'))+'</section>').join('');
  $('counts-line').textContent=jobs.length?jobs.length+' jobs · polling jobs/index.json':'';
  const banner=problems.map(p=>'<div style="max-width:1500px;margin:12px auto 0;padding:10px 14px;background:var(--err-bg);border:1px solid #f3b8b1;border-radius:8px;font-family:var(--mono);font-size:12px">'+esc(p)+'</div>').join('');
  if(html+banner!==lastRender){lastRender=html+banner;$('board').innerHTML=html;$('banner').innerHTML=banner}
}
async function loadJobs(){const ids=JSON.parse(await fetchText('jobs/index.json'));return Promise.all(ids.map(async id=>JSON.parse(await fetchText('jobs/'+id+'/job.json'))))}
async function poll(){const st=$('status');try{jobs=await loadJobs();firstLoad=false;await render();if(openJobId)await refreshDrawer();st.className='live';st.innerHTML='<span class="dot"></span>live · '+new Date().toLocaleTimeString()}catch(e){st.className='live error';st.innerHTML='<span class="dot"></span>'+esc(e.message)}}
const firstLines=new Map();
function fileRank(p){if(p==='spec.md')return[0,1,p];if(p.startsWith('tickets/'))return[0,2,p];if(p==='build.md')return[0,3,p];if(p==='log.md')return[0,3.5,p];const m=p.match(/^round-(\d+)\/review-code\.md$/);if(m)return[0,4+Number(m[1])/100,p];if(p==='decision.md')return[0,10,p];if(/^decision-\d+\.md$/.test(p))return[0,10.5,p];if(p.startsWith('rework-'))return[0,11,p];if(p.startsWith('amend-'))return[0,11.5,p];if(p==='pr.md')return[0,12,p];if(p==='retro.md')return[0,13,p];return[1,0,p]}
async function listFiles(b){const k=['spec.md','build.md','log.md','decision.md','pr.md','retro.md'];const out=[];for(const f of k){try{await fetchText(b+f);out.push(f)}catch{}}for(let n=1;n<=10;n++){try{const f='decision-'+n+'.md';await fetchText(b+f);out.push(f)}catch{}}try{const ix=JSON.parse(await fetchText(b+'tickets.json'));ix.forEach(t=>out.push('tickets/'+t))}catch{}const job=jobs.find(j=>b==='jobs/'+j.id+'/');if(job&&job.round)for(let n=1;n<=job.round;n++){try{await fetchText(b+'round-'+n+'/review-code.md');out.push('round-'+n+'/review-code.md')}catch{}}try{const rw=JSON.parse(await fetchText(b+'rework.json'));rw.forEach(t=>out.push(t))}catch{}return out.sort((a,b2)=>{const[x,y]=[fileRank(a),fileRank(b2)];return x[0]-y[0]||x[1]-y[1]||x[2].localeCompare(y[2])})}
function tone(f){if(/^(VERDICT:\s*PASS|STATUS:\s*DONE)$/.test(f))return'good';if(/^VERDICT:\s*CHANGES$/.test(f)||/^STATUS:\s*BLOCKED$/.test(f))return'warn';if(/^ESCALATE$/.test(f))return'stop';return null}
async function refreshDrawer(){const job=jobs.find(j=>j.id===openJobId);if(!job)return;$('d-num').textContent=job.id+' · '+job.stage+(job.round?' · round '+job.round:'');$('d-title').textContent=job.feature;$('d-branch').textContent=job.branch;const base='jobs/'+job.id+'/';const files=await listFiles(base);if(!openPath||!files.includes(openPath))openPath=files[0]||null;let text=null;if(openPath){text=await fetchText(base+openPath);firstLines.set(base+openPath,text.split('\n')[0].trim())}await Promise.all(files.filter(f=>!firstLines.has(base+f)).map(async f=>{try{firstLines.set(base+f,(await fetchText(base+f)).split('\n')[0].trim())}catch{}}));let g=null;$('d-files').innerHTML=files.map(f=>{const gg=f.includes('/')?f.split('/')[0].replace('round-','Round '):'Job';const h=gg!==g?'<div class="group">'+esc(gg)+'</div>':'';g=gg;const t=tone(firstLines.get(base+f)||'');return h+'<button class="file '+(f===openPath?'on':'')+'" data-file="'+esc(f)+'"><span class="v '+(t||'')+'"></span>'+esc(f)+'</button>'}).join('')||'<div class="empty">No files yet.</div>';if(text!==openText){openText=text;$('d-doc').innerHTML=text===null?'<p>Nothing written yet.</p>':markdown(text)}}
async function openDrawer(id){openJobId=id;openPath=null;openText=undefined;document.body.classList.add('open');try{await refreshDrawer()}catch(e){$('d-doc').innerHTML='<p>'+esc(e.message)+'</p>'}}
function closeDrawer(){openJobId=null;document.body.classList.remove('open')}
document.addEventListener('click',e=>{const c=e.target.closest('[data-job]');if(c)return openDrawer(c.dataset.job);const f=e.target.closest('[data-file]');if(f){openPath=f.dataset.file;openText=undefined;return refreshDrawer()}if(e.target.closest('[data-close]'))closeDrawer()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
function inline(s){const parts=String(s).split('`');let out='';for(let i=0;i<parts.length;i++){if(i%2===1){out+='<code>'+esc(parts[i])+'</code>'}else{let h=esc(parts[i]);h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');h=h.replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<em>$2</em>');out+=h}}return out}
function markdown(src){const lines=src.replace(/\r/g,'').split('\n');let i=0,html='';const first=(lines[0]||'').trim(),t=tone(first);if(t){html+='<div class="verdict '+t+'">'+esc(first)+'</div>';i=1}while(i<lines.length){const line=lines[i];if(!line.trim()){i++;continue}if(line.startsWith('```')){const b=[];i++;while(i<lines.length&&!lines[i].startsWith('```'))b.push(lines[i++]);i++;html+='<pre><code>'+esc(b.join('\n'))+'</code></pre>';continue}const h=line.match(/^(#{1,6})\s+(.*)$/);if(h){html+='<h'+Math.min(h[1].length,4)+'>'+inline(h[2])+'</h'+Math.min(h[1].length,4)+'>';i++;continue}if(/^\s*>/.test(line)){const b=[];while(i<lines.length&&/^\s*>/.test(lines[i]))b.push(lines[i++].replace(/^\s*>\s?/,''));html+='<blockquote>'+inline(b.join(' '))+'</blockquote>';continue}if(/^\s*([-*+]|\d+\.)\s+/.test(line)){const it=[];while(i<lines.length&&/^\s*([-*+]|\d+\.)\s+/.test(lines[i]))it.push(lines[i++].replace(/^\s*([-*+]|\d+\.)\s+/,''));

html+='<ul>'+it.map(x=>'<li>'+inline(x)+'</li>').join('')+'</ul>';continue}const pa=[];while(i<lines.length&&lines[i].trim()&&!/^(#{1,6}\s|```|\s*>)/.test(lines[i])&&!/^\s*([-*+]|\d+\.)\s+/.test(lines[i]))pa.push(lines[i++]);html+='<p>'+inline(pa.join(' '))+'</p>'}return html}
render();poll();setInterval(poll,POLL_MS);
</script>
