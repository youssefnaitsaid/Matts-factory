<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dummy App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Todos</h1>
      <form id="form">
        <input id="text" placeholder="What needs doing?" autocomplete="off" />
        <button type="submit">Add</button>
      </form>
      <p id="count"></p>
      <div id="filters" role="group" aria-label="Filter todos">
        <button type="button" data-filter="all">All</button>
        <button type="button" data-filter="active">Active</button>
        <button type="button" data-filter="completed">Completed</button>
      </div>
      <ul id="list"></ul>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
